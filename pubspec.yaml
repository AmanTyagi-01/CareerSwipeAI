name: career_swipe_ai
description: "CareerSwipe AI - Two-Sided Career & Job Discovery Platform combining ATS resume optimization, swipe-based job discovery, skill gap analysis, and interview prep."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Architecture & State Management
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.1
  equatable: ^2.0.5
  uuid: ^4.3.3

  # Firebase Core & Backend Services
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.0
  firebase_messaging: ^14.8.0
  google_sign_in: ^6.2.1

  # UI, Layout & Animations
  flutter_animate: ^4.5.0
  flutter_card_swiper: ^7.0.0
  smooth_page_indicator: ^1.1.0
  fl_chart: ^0.67.0
  google_fonts: ^6.2.1

  # File Management & Network
  file_picker: ^8.0.0
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
