<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051B11" />
      <stop offset="45%" stop-color="#0E3824" />
      <stop offset="85%" stop-color="#092417" />
      <stop offset="100%" stop-color="#04120B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8DCC4" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D4C3A3" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#1E4B38" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#133D2A" />
      <stop offset="100%" stop-color="#0D2C1E" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="460" fill="url(#bgGrad)" />
  <circle cx="220" cy="110" r="320" fill="url(#accentGlow)" />
  <circle cx="1060" cy="370" r="280" fill="url(#accentGlow)" />

  <!-- Editorial Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="385" x2="1200" y2="385" />
    <line x1="150" y1="0" x2="150" y2="460" />
    <line x1="1050" y1="0" x2="1050" y2="460" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="25" y="25" width="1150" height="410" rx="20" fill="none" stroke="#2DD4BF" stroke-opacity="0.2" stroke-width="1" />

  <!-- Platform Badge Top -->
  <g transform="translate(60, 60)">
    <rect width="250" height="32" rx="16" fill="#0E3824" stroke="#2DD4BF" stroke-opacity="0.4" />
    <circle cx="18" cy="16" r="4.5" fill="#2DD4BF" />
    <text x="32" y="21" fill="#E8DCC4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FLUTTER • RIVERPOD • GEMINI AI</text>
  </g>

  <!-- Brand Typography -->
  <text x="60" y="170" fill="url(#goldGrad)" font-family="'Times New Roman', 'Newsreader', Georgia, serif" font-size="70" font-weight="800" letter-spacing="3">CAREERSWIPE AI</text>
  <text x="60" y="218" fill="#F9F9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="400" letter-spacing="0.8">Intelligent Career Discovery &amp; Dual-Platform Hiring Protocol</text>

  <!-- Tagline Quote -->
  <text x="60" y="265" fill="#A7C7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-style="italic">
    "Stop doom-scrolling job boards. Swipe your next career move with grounded ATS citations."
  </text>

  <!-- Feature Pills -->
  <g transform="translate(60, 312)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="40" rx="10" fill="#0B2B1B" stroke="#2DD4BF" stroke-opacity="0.3" />
    <text x="18" y="25" fill="#F9F9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">🎯 Grounded ATS Match</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="190" height="40" rx="10" fill="#0B2B1B" stroke="#2DD4BF" stroke-opacity="0.3" />
    <text x="213" y="25" fill="#F9F9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">🃏 Tactical 2x2 Swipe Deck</text>

    <!-- Pill 3 -->
    <rect x="400" y="0" width="195" height="40" rx="10" fill="#0B2B1B" stroke="#2DD4BF" stroke-opacity="0.3" />
    <text x="418" y="25" fill="#F9F9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">🏢 Recruiter Talent Funnel</text>

    <!-- Pill 4 -->
    <rect x="610" y="0" width="185" height="40" rx="10" fill="#0B2B1B" stroke="#2DD4BF" stroke-opacity="0.3" />
    <text x="628" y="25" fill="#F9F9F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">💬 Gemini Interview Prep</text>
  </g>

  <!-- Tactile Phone Mockup On Right -->
  <g transform="translate(865, 42)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="245" height="376" rx="34" fill="#05170F" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="2" />
    <!-- Dynamic Island -->
    <rect x="82" y="12" width="80" height="16" rx="8" fill="#000000" />

    <!-- Screen Content: Mini Swipe Card -->
    <g transform="translate(18, 42)">
      <!-- Card Container -->
      <rect x="0" y="0" width="209" height="260" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" />

      <!-- Top Row: Role + Fit Badge -->
      <text x="14" y="26" fill="#F9F9F8" font-family="'Times New Roman', Georgia, serif" font-size="14" font-weight="700">Senior Backend Dev</text>
      <text x="14" y="44" fill="#2DD4BF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Stripe • Remote EMEA</text>
      
      <!-- Fit Pill -->
      <rect x="146" y="14" width="50" height="22" rx="11" fill="#2DD4BF" fill-opacity="0.15" stroke="#2DD4BF" stroke-width="1" />
      <text x="156" y="29" fill="#2DD4BF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">94.2%</text>

      <!-- 2x2 Grid -->
      <rect x="12" y="60" width="88" height="52" rx="8" fill="#061F13" />
      <text x="20" y="78" fill="#A7C7B7" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600">COMPENSATION</text>
      <text x="20" y="98" fill="#F9F9F8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">$185k - $220k</text>

      <rect x="108" y="60" width="88" height="52" rx="8" fill="#061F13" />
      <text x="116" y="78" fill="#A7C7B7" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600">POLICY</text>
      <text x="116" y="98" fill="#F9F9F8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">100% Remote</text>

      <rect x="12" y="120" width="88" height="52" rx="8" fill="#061F13" />
      <text x="20" y="138" fill="#A7C7B7" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600">CORE STACK</text>
      <text x="20" y="158" fill="#F9F9F8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Go, K8s, Kafka</text>

      <rect x="108" y="120" width="88" height="52" rx="8" fill="#061F13" />
      <text x="116" y="138" fill="#A7C7B7" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600">HIRING SPEED</text>
      <text x="116" y="158" fill="#F9F9F8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Fast-Track (7d)</text>

      <!-- Decision Stamp -->
      <g transform="translate(18, 185) rotate(-6)">
        <rect width="174" height="28" rx="6" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-width="1.2" stroke-dasharray="4,2" />
        <text x="16" y="19" fill="#2DD4BF" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.2">✦ GROUNDED EVIDENCE MATCH ✦</text>
      </g>

      <!-- Bottom Swipe Action Indicators -->
      <circle cx="60" cy="236" r="14" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1" />
      <text x="56" y="240" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">✕</text>

      <circle cx="150" cy="236" r="14" fill="#2DD4BF" fill-opacity="0.2" stroke="#2DD4BF" stroke-width="1" />
      <text x="146" y="240" fill="#2DD4BF" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">✓</text>
    </g>

    <!-- Bottom System Indicator -->
    <rect x="80" y="322" width="85" height="4" rx="2" fill="#ffffff" fill-opacity="0.3" />
  </g>
</svg>
